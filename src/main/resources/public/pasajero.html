<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGo - Panel Pasajero</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f1f5f9; }

        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        .passenger-panel {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            max-width: 480px; margin: 0 auto; background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 1000; display: flex; flex-direction: column; gap: 12px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .app-title { font-size: 18px; font-weight: 800; color: #1e40af; }
        
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8fafc;
            padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 15px; font-weight: 700; color: #0f172a; }
        .stat-label { font-size: 11px; color: #64748b; font-weight: 500; }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; font-weight: 600; color: #64748b; }
        .input-field {
            padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 13px; outline: none; color: #0f172a;
        }

        .btn-solicitar {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; border: none; padding: 14px; border-radius: 12px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); text-align: center;
        }
        .btn-solicitar:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .search-container { display: flex; gap: 8px; }
        .btn-buscar {
            background: #334155; color: white; border: none; padding: 0 14px;
            border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer;
        }

        .custom-moto-marker { font-size: 28px; text-align: center; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- PANEL DE CONTROL DEL PASAJERO -->
    <div class="passenger-panel">
        <div class="card-header">
            <div class="app-title">MotoGo Pasajero 🛵</div>
            <a href="conductor.html" style="font-size:12px; color:#3b82f6; text-decoration:none;">Ir a Conductor</a>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="estado-texto">Seleccionando</div>
                <div class="stat-label">Estado de Solicitud</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" style="color: #16a34a;" id="unidades-cerca">Radar Activo</div>
                <div class="stat-label">Unidades en Zona</div>
            </div>
        </div>

        <div class="input-group">
            <label>Buscar Destino (Calles, Distritos, Departamentos)</label>
            <div class="search-container">
                <input type="text" id="destino-input" class="input-field" style="flex:1;" value="Plaza Vea - El Agustino" placeholder="Ej. Av. Arequipa, Lima...">
                <button class="btn-buscar" onclick="buscarLugar()">Buscar</button>
            </div>
        </div>

        <div id="info-viaje" style="font-size: 13px; color: #334155; line-height: 1.4;">
            Arrastra el marcador azul en el mapa, escribe tu destino o haz clic en cualquier lugar.
        </div>

        <button class="btn-solicitar" id="btn-solicitar" onclick="solicitarMotoGo()">Solicitar Mototaxi en Vivo</button>
    </div>

    <!-- Leaflet JS y Routing Machine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script>
        // Inicializar mapa centrado en Lima / El Agustino
        const map = L.map('map', { zoomControl: false }).setView([-12.0498, -77.0019], 15);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let latPasajero = -12.0498;
        let lonPasajero = -77.0019;
        let destinoLat = -12.0464;
        let destinoLon = -77.0428;

        // Marcador del Pasajero (Recogida)
        let marcadorPasajero = L.marker([latPasajero, lonPasajero], { draggable: true }).addTo(map)
            .bindPopup("<b>Tu ubicación de recogida</b>").openPopup();

        marcadorPasajero.on('dragend', function(e) {
            const pos = marcadorPasajero.getLatLng();
            latPasajero = pos.lat;
            lonPasajero = pos.lng;
        });

        // Marcador de Destino
        let marcadorDestino = L.marker([destinoLat, destinoLon], { draggable: true, icon: L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        }) }).addTo(map).bindPopup("<b>Destino</b>");

        marcadorDestino.on('dragend', function(e) {
            const pos = marcadorDestino.getLatLng();
            destinoLat = pos.lat;
            destinoLon = pos.lng;
            actualizarRutaVisual();
        });

        // Evento al hacer clic en el mapa para mover la recogida
        map.on('click', function(e) {
            latPasajero = e.latlng.lat;
            lonPasajero = e.latlng.lng;
            marcadorPasajero.setLatLng([latPasajero, lonPasajero]);
        });

        let routingControl = null;

        function actualizarRutaVisual() {
            if (routingControl) {
                map.removeControl(routingControl);
            }
            try {
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(latPasajero, lonPasajero),
                        L.latLng(destinoLat, destinoLon)],
    
                    routeWhileDragging: false,
                    language: 'es',
                    show: true,
                    addWaypoints: false,
                    fitSelectedRoutes: true
                }).addTo(map);
            } catch (e) {
                console.error("Error al trazar ruta:", e);
            }
        }

        // Función para buscar cualquier lugar, calle, distrito o departamento usando Nominatim
        function buscarLugar() {
            const query = document.getElementById('destino-input').value.trim();
            if (!query) return;

            document.getElementById('estado-texto').innerText = "Buscando...";
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lugar = data[0];
                        destinoLat = parseFloat(lugar.lat);
                        destinoLon = parseFloat(lugar.lon);
                        
                        marcadorDestino.setLatLng([destinoLat, destinoLon]);
                        map.setView([destinoLat, destinoLon], 15);
                        marcadorDestino.bindPopup(`<b>Destino:</b> ${lugar.display_name}`).openPopup();
                        
                        document.getElementById('estado-texto').innerText = "Destino OK";
                        actualizarRutaVisual();
                    } else {
                        alert("No se encontró el lugar especificado. Intenta con mayor detalle.");
                        document.getElementById('estado-texto').innerText = "No hallado";
                    }
                })
                .catch(err => {
                    console.error("Error en geocodificación:", err);
                    alert("Error buscando el lugar.");
                    document.getElementById('estado-texto').innerText = "Error";
                });
        }

        let intervaloRastreoConductor = null;
        let marcadorMototaxiEnRuta = null;
        const BACKEND_URL = "https://motogo-backend-kx9f.onrender.com";

        function solicitarMotoGo() {
            const btn = document.getElementById('btn-solicitar');
            const destinoTexto = document.getElementById('destino-input').value.trim();
            
            btn.innerText = "Buscando mototaxi cercano...";
            btn.disabled = true;
            document.getElementById('estado-texto').innerText = "Procesando...";

            const formData = new URLSearchParams();
            formData.append('lat', latPasajero);
            formData.append('lon', lonPasajero);
            formData.append('destino', destinoTexto);

            fetch(`${BACKEND_URL}/api/solicitar-viaje`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.exito) {
                    document.getElementById('estado-texto').innerText = "¡Enlazado!";
                    document.getElementById('info-viaje').innerHTML = `
                        <strong>Conductor Asignado:</strong> ${data.conductor_asignado}<br>
                        <strong>Placa Oficial:</strong> ${data.placa}<br>
                        <strong>Destino:</strong> ${data.destino}<br>
                        <em>¡Tu mototaxi está en camino en tiempo real!</em>
                    `;
                    btn.innerText = "Viaje en Curso";

                    // Iniciar rastreo en vivo de la moto del celular
                    iniciarRastreoEnVivo(data.placa);
                } else {
                    alert(data.mensaje);
                    btn.innerText = "Solicitar Mototaxi en Vivo";
                    btn.disabled = false;
                    document.getElementById('estado-texto').innerText = "Sin unidades";
                }
            })
            .catch(err => {
                console.error("Error al solicitar viaje:", err);
                alert("Error de conexión con el servidor en la nube.");
                btn.innerText = "Solicitar Mototaxi en Vivo";
                btn.disabled = false;
                document.getElementById('estado-texto').innerText = "Error";
            });
        }

        function iniciarRastreoEnVivo(placaConductor) {
            intervaloRastreoConductor = setInterval(() => {
                fetch(`${BACKEND_URL}/api/listar-conductores`)
                    .then(res => res.json())
                    .then(conductores => {
                        const conductorActual = conductores.find(c => c.placa === placaConductor);
                        if (conductorActual) {
                            const nuevaLat = conductorActual.lat;
                            const nuevaLon = conductorActual.lon;
                            const motoIcon = L.divIcon({ html: '🛵', className: 'custom-moto-marker', iconSize: [32, 32] });

                            if (!marcadorMototaxiEnRuta) {
                                marcadorMototaxiEnRuta = L.marker([nuevaLat, nuevaLon], { icon: motoIcon }).addTo(map)
                                    .bindPopup(`<b>Mototaxi (${placaConductor}) en camino</b>`).openPopup();
                            } else {
                                marcadorMototaxiEnRuta.setLatLng([nuevaLat, nuevaLon]);
                            }
                        }
                    })
                    .catch(err => console.error("Error rastreando posición:", err));
            }, 3000);
        }
    </script>
</body>
</html>
