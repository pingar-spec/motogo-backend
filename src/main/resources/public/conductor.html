<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGo - Panel Conductor</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f1f5f9; }

        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Ocultar la caja de texto flotante pesada para que no tape la pantalla del celular */
        .leaflet-routing-container { display: none !important; }

        .driver-panel {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            max-width: 480px; margin: 0 auto; background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 1000; display: flex; flex-direction: column; gap: 12px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .app-title { font-size: 18px; font-weight: 800; color: #1e40af; }
        
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8fafc;
            padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 15px; font-weight: 700; color: #0f172a; }
        .stat-label { font-size: 11px; color: #64748b; font-weight: 500; }

        .btn-action {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white; border: none; padding: 14px; border-radius: 12px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4); text-align: center;
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
        }
        .btn-accept {
            background: #16a34a; color: white; border: none; padding: 10px; border-radius: 8px;
            font-weight: 700; cursor: pointer; flex: 1; font-size: 13px;
        }
        .btn-reject {
            background: #dc2626; color: white; border: none; padding: 10px; border-radius: 8px;
            font-weight: 700; cursor: pointer; flex: 1; font-size: 13px;
        }

        .custom-moto-marker { font-size: 28px; text-align: center; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- PANEL DE CONTROL DEL CONDUCTOR -->
    <div class="driver-panel">
        <div class="card-header">
            <div class="app-title">MotoGo Conductor 🛵</div>
            <a href="pasajero.html" style="font-size:12px; color:#3b82f6; text-decoration:none;">Ir a Pasajero</a>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="estado-radar">En Espera</div>
                <div class="stat-label">Radar</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" style="color: #64748b;" id="estado-conexion">Desconectado</div>
                <div class="stat-label">GPS en Vivo</div>
            </div>
        </div>

        <div id="info-conductor" style="font-size: 13px; color: #334155; line-height: 1.4;">
            <strong>Conductor:</strong> Piero<br>
            <strong>Placa:</strong> B5Y-957<br>
            <em>Activa el radar para recibir solicitudes de pasajeros cercanos.</em>
        </div>

        <button class="btn-action" id="btn-radar" onclick="toggleRadar()">Conectar y Activar Radar</button>
    </div>

    <!-- Leaflet JS y Routing Machine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([-12.0498, -77.0019], 15);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let watchId = null;
        let radarActivo = false;
        let marcadorConductor = null;
        let marcadorRecogidaPasajero = null;
        let marcadorDestinoFinal = null;
        let routingRuta1 = null; // Ruta Azul (Hacia Pasajero)
        let routingRuta2 = null; // Ruta Verde (Hacia Destino Final)
        let intervaloVerificarViaje = null;
        let viajePendienteActual = null;

        const BACKEND_URL = "https://motogo-backend-kx9f.onrender.com";
        const placaConductor = "B5Y-957";
        const nombreConductor = "Piero";

        let latActual = -12.0498;
        let lonActual = -77.0019;

        function toggleRadar() {
            const btn = document.getElementById('btn-radar');
            if (!radarActivo) {
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(pos => {
                        latActual = pos.coords.latitude;
                        lonActual = pos.coords.longitude;
                        const precision = pos.coords.accuracy;

                        if (precision > 50) return; // Filtrar saltos bruscos de GPS

                        const motoIcon = L.divIcon({ html: '🛵', className: 'custom-moto-marker', iconSize: [32, 32] });
                        
                        if (!marcadorConductor) {
                            marcadorConductor = L.marker([latActual, lonActual], { icon: motoIcon }).addTo(map)
                                .bindPopup("<b>Tu Ubicación GPS</b>").openPopup();
                            map.setView([latActual, lonActual], 16);
                        } else {
                            marcadorConductor.setLatLng([latActual, lonActual]);
                        }

                        enviarPosicionAlServidor(latActual, lonActual);
                    }, err => console.warn("GPS Error: " + err.message), { 
                        enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 
                    });
                }

                radarActivo = true;
                btn.innerText = "Desactivar Radar";
                btn.classList.add('btn-danger');
                document.getElementById('estado-radar').innerText = "Activo";
                document.getElementById('estado-conexion').innerText = "Conectado";
                document.getElementById('estado-conexion').style.color = "#16a34a";
                
                // Consultar solicitudes cada 3 segundos apuntando al endpoint sincronizado en Java
                intervaloVerificarViaje = setInterval(verificarSolicitudesViaje, 3000);

            } else {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                if (intervaloVerificarViaje) clearInterval(intervaloVerificarViaje);
                radarActivo = false;
                btn.innerText = "Conectar y Activar Radar";
                btn.classList.remove('btn-danger');
                document.getElementById('estado-radar').innerText = "En Espera";
                document.getElementById('estado-conexion').innerText = "Desconectado";
                document.getElementById('estado-conexion').style.color = "#64748b";
            }
        }

        function enviarPosicionAlServidor(lat, lon) {
            fetch(`${BACKEND_URL}/api/registrar-conductor`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `nombre=${encodeURIComponent(nombreConductor)}&placa=${encodeURIComponent(placaConductor)}&lat=${lat}&lon=${lon}`
            }).catch(err => console.error("Error enviando posición:", err));
        }

        function verificarSolicitudesViaje() {
            fetch(`${BACKEND_URL}/api/verificar-viaje-conductor?placa=${placaConductor}`)
                .then(res => res.json())
                .then(viaje => {
                    if (viaje && viaje.en_espera && !viajePendienteActual) {
                        viajePendienteActual = viaje;
                        mostrarAlertaSolicitud(viaje);
                    }
                })
                .catch(err => console.error("Error verificando viaje:", err));
        }

        function mostrarAlertaSolicitud(viaje) {
            document.getElementById('info-conductor').innerHTML = `
                <strong style="color: #2563eb;">¡Nueva Solicitud de Pasajero!</strong><br>
                <strong>Pasajero:</strong> ${viaje.pasajero}<br>
                <strong>Destino:</strong> ${viaje.destino}<br><br>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-accept" onclick="aceptarViaje()">Aceptar</button>
                    <button class="btn-reject" onclick="rechazarViaje()">Rechazar</button>
                </div>
            `;
        }

        function aceptarViaje() {
            if (!viajePendienteActual) return;
            const viaje = viajePendienteActual;
            
            fetch(`${BACKEND_URL}/api/responder-viaje`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `viaje_id=${viaje.viaje_id}&respuesta=ACEPTADO`
            }).catch(err => console.error("Error al aceptar viaje:", err));

            trazarRutasNavegacion(viaje.latPasajero, viaje.lonPasajero, viaje.latDestino, viaje.lonDestino, viaje.pasajero);
        }

        function rechazarViaje() {
            if (viajePendienteActual) {
                fetch(`${BACKEND_URL}/api/responder-viaje`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `viaje_id=${viajePendienteActual.viaje_id}&respuesta=RECHAZADO`
                }).catch(err => console.error("Error al rechazar viaje:", err));
            }

            viajePendienteActual = null;
            limpiarRutasMapa();

            document.getElementById('info-conductor').innerHTML = `
                <strong>Conductor:</strong> ${nombreConductor}<br>
                <strong>Placa:</strong> ${placaConductor}<br>
                <em>Radar activo esperando nuevas solicitudes...</em>
            `;
        }

        function trazarRutasNavegacion(latP, lonP, latD, lonD, nombrePasajero) {
            limpiarRutasMapa();

            marcadorRecogidaPasajero = L.marker([latP, lonP]).addTo(map)
                .bindPopup(`<b>Recoger a:</b> ${nombrePasajero}`).openPopup();

            const redIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            });
            marcadorDestinoFinal = L.marker([latD, lonD], { icon: redIcon }).addTo(map)
                .bindPopup("<b>Destino Final</b>");

            // RUTA 1: Conductor hacia el Pasajero (Color Azul)
            routingRuta1 = L.Routing.control({
                waypoints: [L.latLng(latActual, lonActual), L.latLng(latP, lonP)],
                routeWhileDragging: false, addWaypoints: false, createMarker: function() { return null; },
                lineOptions: { styles: [{ color: '#2563eb', weight: 6, opacity: 0.85 }] }
            }).addTo(map);

            // RUTA 2: Pasajero hacia el Destino (Color Verde)
            routingRuta2 = L.Routing.control({
                waypoints: [L.latLng(latP, lonP), L.latLng(latD, lonD)],
                routeWhileDragging: false, addWaypoints: false, createMarker: function() { return null; },
                lineOptions: { styles: [{ color: '#16a34a', weight: 6, opacity: 0.85 }] }
            }).addTo(map);

            document.getElementById('info-conductor').innerHTML = `
                <strong>¡Viaje en Curso!</strong><br>
                <strong>Pasajero:</strong> ${nombrePasajero}<br>
                <span style="color:#2563eb; font-weight:700;">■ Ruta Azul: Hacia el punto de recojo</span><br>
                <span style="color:#16a34a; font-weight:700;">■ Ruta Verde: Hacia el destino final</span><br><br>
                <button onclick="rechazarViaje()" style="background:#dc2626; color:white; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700; width:100%;">Finalizar / Cancelar Servicio</button>
            `;
        }

        function limpiarRutasMapa() {
            if (routingRuta1) { map.removeControl(routingRuta1); routingRuta1 = null; }
            if (routingRuta2) { map.removeControl(routingRuta2); routingRuta2 = null; }
            if (marcadorRecogidaPasajero) { map.removeLayer(marcadorRecogidaPasajero); marcadorRecogidaPasajero = null; }
            if (marcadorDestinoFinal) { map.removeLayer(marcadorDestinoFinal); marcadorDestinoFinal = null; }
        }
    </script>
</body>
</html>
