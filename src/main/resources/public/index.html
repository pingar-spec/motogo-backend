<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGo - Tu Mototaxi en Línea</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f7f6; color: #333; overflow: hidden; }
        #sidebar { width: 380px; background: white; padding: 25px; box-shadow: 4px 0 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        h1 { color: #ff5722; font-size: 26px; margin-bottom: 5px; font-weight: 700; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: #444; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #ff5722; }
        button { background-color: #ff5722; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #e64a19; }
        #resultado { margin-top: 25px; padding: 15px; background: #fff8f5; border: 1px solid #ffccbc; border-radius: 8px; display: none; }
        #resultado h3 { color: #d84315; font-size: 16px; margin-bottom: 8px; }
        #resultado p { font-size: 14px; margin-bottom: 5px; color: #555; }
        .badge { display: inline-block; background: #ffebee; color: #c62828; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
        .badge.success { background: #e8f5e9; color: #2e7d32; }

        /* Adaptación perfecta para celulares */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            #sidebar { width: 100%; max-height: 45vh; }
            #map { width: 100%; height: 55vh; min-height: 300px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>MotoGo 🛵</h1>
        <p class="subtitle">Tu viaje seguro y rápido en mototaxi</p>

        <div class="form-group">
            <label for="destino">¿A dónde te diriges?</label>
            <input type="text" id="destino" placeholder="Ej. Plaza Principal, Av. Universitaria...">
        </div>

        <div class="form-group">
            <label>Tu ubicación actual (GPS)</label>
            <input type="text" id="ubicacion" readonly value="Obteniendo coordenadas GPS...">
        </div>

        <button onclick="solicitarViaje()">Pedir Mototaxi Ahora</button>

        <div id="resultado">
            <span id="estado-badge" class="badge">ESTADO</span>
            <h3 id="res-titulo">Buscando unidad...</h3>
            <p id="res-detalle"></p>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa centrado en Lima por defecto
        const map = L.map('map').setView([-12.0464, -77.0428], 15);

        // Capa Satelital de alta definición estilo Google Earth (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }).addTo(map);

        // Añadir una capa de etiquetas de calles por encima de la satelital para ver nombres de vías claramente
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            opacity: 0.8
        }).addTo(map);

        let markerPasajero = null;
        let markerMoto = null;
        let pasajeroLat = -12.0464;
        let pasajeroLon = -77.0428;

        // Obtener ubicación GPS real del pasajero
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                pasajeroLat = position.coords.latitude;
                pasajeroLon = position.coords.longitude;

                document.getElementById('ubicacion').value = `${pasajeroLat.toFixed(5)}, ${pasajeroLon.toFixed(5)}`;
                
                map.setView([pasajeroLat, pasajeroLon], 17); // Zoom más cercano estilo satelital detallado
                markerPasajero = L.marker([pasajeroLat, pasajeroLon]).addTo(map)
                    .bindPopup("<b>¡Tú estás aquí!</b>")
                    .openPopup();
            }, error => {
                document.getElementById('ubicacion').value = "Coordenadas por defecto (Lima Centro)";
            });
        }

        async function solicitarViaje() {
            const destino = document.getElementById('destino').value;
            if (!destino) {
                alert("Por favor ingresa tu destino.");
                return;
            }

            const resDiv = document.getElementById('resultado');
            const badge = document.getElementById('estado-badge');
            const titulo = document.getElementById('res-titulo');
            const detalle = document.getElementById('res-detalle');

            resDiv.style.display = "block";
            badge.className = "badge";
            badge.innerText = "BUSCANDO";
            titulo.innerText = "Localizando unidad cercana...";
            detalle.innerText = "Calculando la ruta óptima por proximidad...";

            try {
                const response = await fetch(`/api/solicitar-viaje?lat=${pasajeroLat}&lon=${pasajeroLon}&destino=${encodeURIComponent(destino)}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok && data.exito) {
                    badge.className = "badge success";
                    badge.innerText = "CONDUCTOR ASIGNADO";
                    titulo.innerText = `¡Mototaxi en camino: ${data.conductor_asignado}!`;
                    detalle.innerHTML = `<strong>Placa:</strong> ${data.placa} <br><strong>Distancia:</strong> ${data.distancia_km} km <br><strong>Destino:</strong> ${data.destino}`;

                    // Simular la moto acercándose desde un punto cercano en el mapa satelital
                    simularMovimientoMoto(pasajeroLat + 0.003, pasajeroLon + 0.003, pasajeroLat, pasajeroLon);

                } else {
                    badge.className = "badge";
                    badge.innerText = "SIN UNIDADES";
                    titulo.innerText = "No hay unidades disponibles";
                    detalle.innerText = data.mensaje || "Inténtalo de nuevo en unos momentos.";
                }
            } catch (err) {
                badge.className = "badge";
                badge.innerText = "ERROR";
                titulo.innerText = "Error de conexión";
                detalle.innerText = "No se pudo comunicar con el servidor en la nube.";
            }
        }

        // Función para animar el acercamiento de la moto en tiempo real en el mapa
        function simularMovimientoMoto(latIni, lonIni, latFin, lonFin) {
            if (markerMoto) {
                map.removeLayer(markerMoto);
            }

            // Icono personalizado para la mototaxi
            const motoIcon = L.divIcon({
                html: '🛵',
                className: 'custom-moto-icon',
                iconSize: [30, 30]
            });

            let currentLat = latIni;
            let currentLon = lonIni;
            markerMoto = L.marker([currentLat, currentLon], { icon: motoIcon }).addTo(map)
                .bindPopup("<b>Mototaxi en camino</b>").openPopup();

            let pasos = 50;
            let step = 0;

            let intervalo = setInterval(() => {
                step++;
                currentLat += (latFin - currentLat) / (pasazos = 50 - step + 1);
                currentLon += (lonFin - currentLon) / (pasazos = 50 - step + 1);
                
                if (markerMoto) {
                    markerMoto.setLatLng([currentLat, currentLon]);
                }

                if (step >= 50) {
                    clearInterval(intervalo);
                    if (markerMoto) {
                        markerMoto.bindPopup("<b>¡Tu mototaxi ha llegado!</b>").openPopup();
                    }
                }
            }, 200);
        }
    </script>
</body>
</html>
