<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGo - Solicitar Viaje</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f1f5f9; color: #1e293b; overflow: hidden; }
        
        #sidebar { 
            width: 400px; background: #ffffff; padding: 30px; 
            box-shadow: 5px 0 25px rgba(0,0,0,0.1); display: flex; 
            flex-direction: column; z-index: 1000; 
        }
        
        #map { flex-grow: 1; height: 100%; }

        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .brand h1 { color: #ea580c; font-size: 26px; font-weight: 800; }

        .input-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 11px; color: #64748b; text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; 
            font-size: 14px; background: #ffffff; color: #0f172a; 
        }
        input:read-only { background-color: #e2e8f0; color: #475569; cursor: not-allowed;}

        .btn-primary { 
            background: linear-gradient(to right, #f97316, #ea580c); color: white; border: none; 
            padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: 700; 
            cursor: pointer; transition: opacity 0.2s; 
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { background: #94a3b8; cursor: wait; }

        #resultado { margin-top: 10px; padding: 15px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; display: none; }
        #resultado h3 { color: #9a3412; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        #resultado p { font-size: 12px; color: #431407; }
        .badge { display: inline-block; background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-bottom: 6px; }
        .badge.success { background: #dcfce7; color: #166534; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; max-height: 45vh; padding: 20px; }
            #map { width: 100%; height: 55vh; }
        }
        
        /* Estilo para el marcador del pasajero */
        .custom-user-marker {
            background-color: #3b82f6;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="brand">
            <h1>MotoGo</h1>
        </div>

        <div class="input-card">
            <div class="form-group">
                <label for="destino">¿A dónde vas?</label>
                <input type="text" id="destino" placeholder="Ej. Av. Larco 101, Miraflores">
            </div>

            <div class="form-group">
                <label>Tu ubicación actual</label>
                <!-- Este campo se llenará con la dirección real -->
                <input type="text" id="ubicacion-direccion" readonly value="Obteniendo dirección...">
                <!-- Campo oculto para guardar las coordenadas puras para el backend -->
                <input type="hidden" id="ubicacion-coordenadas">
            </div>

            <button id="btn-solicitar" class="btn-primary" onclick="solicitarViaje()" disabled>Solicitar Mototaxi</button>
        </div>

        <div id="resultado">
            <span id="estado-badge" class="badge">ESTADO</span>
            <h3 id="res-titulo">Procesando...</h3>
            <p id="res-detalle"></p>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicializar mapa centrado en Lima (se actualizará con GPS)
        const map = L.map('map', { zoomControl: false }).setView([-12.0464, -77.0428], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. Usar capa vectorial nítida y limpia (CartoDB Voyager - Estilo App Moderna)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        let markerPasajero = null;
        let markerMoto = null;

        // 3. Obtener ubicación GPS y convertir a dirección (Geocodificación Inversa)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Guardar coordenadas ocultas
                document.getElementById('ubicacion-coordenadas').value = `${lat},${lon}`;
                
                // Centrar mapa y poner marcador visual
                map.setView([lat, lon], 16);
                
                const userIcon = L.divIcon({
                    className: 'custom-user-marker',
                    iconSize: [20, 20]
                });
                
                markerPasajero = L.marker([lat, lon], {icon: userIcon}).addTo(map)
                    .bindPopup("<b>Tu ubicación</b>");

                // --- LLAMADA A LA API DE NOMINATIM (OpenStreetMap) PARA LA DIRECCIÓN ---
                const dirInput = document.getElementById('ubicacion-direccion');
                const btnSolicitar = document.getElementById('btn-solicitar');

                try {
                    // Petición a Nominatim para geocodificación inversa
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                    const data = await response.json();

                    if (data && data.display_name) {
                        // Simplificar el nombre de la dirección (opcional, para que no sea tan largo)
                        const direccionCorta = data.display_name.split(',').slice(0, 3).join(',');
                        dirInput.value = direccionCorta; // Mostramos dirección corta
                    } else {
                        dirInput.value = "Dirección no encontrada (usa el mapa)";
                    }
                } catch (err) {
                    console.error("Error en geocodificación:", err);
                    dirInput.value = "Error al obtener dirección";
                } finally {
                    btnSolicitar.disabled = false; // Habilitar botón una vez tengamos coords (falle o no la dir)
                }

            }, error => {
                // Si el usuario deniega el GPS
                document.getElementById('ubicacion-direccion').value = "GPS desactivado o error.";
                document.getElementById('btn-solicitar').disabled = false; // Habilitar igual para que ingrese manual
                alert("Por favor activa tu GPS para ubicarte automáticamente.");
            }, { enableHighAccuracy: true });
        } else {
            alert("Tu navegador no soporta geolocalización.");
        }

        async function solicitarViaje() {
            const destino = document.getElementById('destino').value;
            const coordenadas = document.getElementById('ubicacion-coordenadas').value;

            if (!destino) {
                alert("Por favor ingresa tu destino.");
                return;
            }
            if (!coordenadas || coordenadas.includes("undefined")) {
                alert("No se ha obtenido tu ubicación GPS. Por favor espera o recarga la página.");
                return;
            }

            const [lat, lon] = coordenadas.split(',');

            const resDiv = document.getElementById('resultado');
            const badge = document.getElementById('estado-badge');
            const titulo = document.getElementById('res-titulo');
            const detalle = document.getElementById('res-detalle');

            resDiv.style.display = "block";
            badge.className = "badge";
            badge.innerText = "BUSCANDO";
            titulo.innerText = "Calculando ruta y buscando unidades...";
            detalle.innerText = "Consultando backend en Render... (Esto puede tardar unos segundos si el servidor estaba dormido)";
            
            const btn = document.getElementById('btn-solicitar');
            btn.innerText = "Procesando...";
            btn.disabled = true;

            try {
                // Petición POST a tu backend en Render
                const response = await fetch(`/api/solicitar-viaje?lat=${lat}&lon=${lon}&destino=${encodeURIComponent(destino)}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok && data.exito) {
                    badge.className = "badge success";
                    badge.innerText = "UNIDAD ASIGNADA";
                    titulo.innerText = `¡Mototaxi en camino: ${data.conductor_asignado}!`;
                    detalle.innerHTML = `<strong>Placa:</strong> ${data.placa} <br><strong>Distancia:</strong> ${data.distancia_km} km <br><strong>Destino:</strong> ${data.destino}`;
                    
                    // Animación de la moto acercándose
                    simularMovimientoMoto(parseFloat(lat)+0.003, parseFloat(lon)+0.003, lat, lon);

                } else {
                    badge.className = "badge";
                    badge.innerText = "SIN UNIDADES";
                    titulo.innerText = "No hay unidades disponibles";
                    detalle.innerText = data.mensaje || "Inténtalo de nuevo en unos momentos.";
                }
            } catch (err) {
                badge.className = "badge";
                badge.innerText = "ERROR DE RED";
                titulo.innerText = "Fallo de conexión";
                detalle.innerText = "No se pudo comunicar con el servidor en Render. Verifica tu internet o intenta más tarde.";
            } finally {
                btn.innerText = "Solicitar Mototaxi";
                btn.disabled = false;
            }
        }

        // Función de simulación (la misma de antes, solo para vista)
        function simularMovimientoMoto(latIni, lonIni, latFin, lonFin) {
            if (markerMoto) map.removeLayer(markerMoto);

            const motoIcon = L.divIcon({
                html: '🛵',
                className: 'custom-moto-icon',
                iconSize: [32, 32]
            });

            let currentLat = latIni;
            let currentLon = lonIni;
            markerMoto = L.marker([currentLat, currentLon], { icon: motoIcon }).addTo(map)
                .bindPopup("<b>🛵 Mototaxi acercándose</b>").openPopup();

            let step = 0;
            const totalPasos = 40;

            let intervalo = setInterval(() => {
                step++;
                currentLat += (latFin - currentLat) / (totalPasos - step + 1);
                currentLon += (lonFin - currentLon) / (totalPasos - step + 1);
                
                if (markerMoto) markerMoto.setLatLng([currentLat, currentLon]);

                if (step >= totalPasos) {
                    clearInterval(intervalo);
                    if (markerMoto) markerMoto.bindPopup("<b>✅ ¡Tu mototaxi ha llegado!</b>").openPopup();
                }
            }, 150);
        }
    </script>
</body>
</html>
