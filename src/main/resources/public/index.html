<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGo - Movilidad Inteligente</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f1f5f9; color: #1e293b; overflow: hidden; }
        
        #sidebar { 
            width: 420px; background: #ffffff; padding: 30px; 
            box-shadow: 5px 0 25px rgba(0,0,0,0.1); display: flex; 
            flex-direction: column; z-index: 1000; overflow-y: auto;
        }
        
        #map { flex-grow: 1; height: 100%; }

        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; }
        .brand h1 { color: #ea580c; font-size: 26px; font-weight: 800; }

        .input-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 11px; color: #64748b; text-transform: uppercase; }
        
        select, input { 
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; 
            font-size: 14px; background: #ffffff; color: #0f172a; outline: none;
        }
        select:focus, input:focus { border-color: #ea580c; box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15); }

        .helper-text { font-size: 11px; color: #16a34a; margin-top: 4px; font-weight: 600; }

        .btn-primary { 
            background: linear-gradient(to right, #f97316, #ea580c); color: white; border: none; 
            padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: 700; 
            cursor: pointer; transition: opacity 0.2s; 
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { background: #94a3b8; cursor: wait; }

        #resultado { margin-top: 10px; padding: 15px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; display: none; }
        #resultado h3 { color: #9a3412; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        #resultado p { font-size: 12px; color: #431407; }
        .badge { display: inline-block; background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-bottom: 6px; }
        .badge.success { background: #dcfce7; color: #166534; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; max-height: 50vh; padding: 20px; }
            #map { width: 100%; height: 50vh; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="brand">
            <h1>MotoGo 🛵</h1>
        </div>

        <div class="input-card">
            <div class="form-group">
                <label for="destino-select">¿A qué zona o distrito te diriges?</label>
                <select id="destino-select">
                    <option value="" disabled selected>Selecciona tu destino...</option>
                    <optgroup label="El Agustino">
                        <option value="Municipalidad de El Agustino">Municipalidad de El Agustino</option>
                        <option value="Hospital Hipólito Unanue">Hospital Hipólito Unanue</option>
                        <option value="Puente Nuevo - El Agustino">Puente Nuevo</option>
                        <option value="Parque El Agustino">Parque Principal</option>
                    </optgroup>
                    <optgroup label="San Juan de Lurigancho">
                        <option value="Estación Bayóvar SJL">Estación Bayóvar (SJL)</option>
                        <option value="Universidad César Vallejo SJL">Universidad César Vallejo (SJL)</option>
                        <option value="Parque Zonal Huáscar SJL">Parque Zonal Huáscar</option>
                        <option value="Mall Aventura SJL">Mall Aventura SJL</option>
                    </optgroup>
                    <optgroup label="Cercado de Lima / Centro">
                        <option value="Plaza de Armas de Lima">Plaza de Armas de Lima</option>
                        <option value="Avenida Abancay Centro">Av. Abancay</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Tu ubicación GPS en tiempo real</label>
                <input type="text" id="ubicacion-texto" readonly value="Conectando con satélites GPS...">
                <p class="helper-text">🛰️ GPS de alta precisión activo.</p>
                <input type="hidden" id="lat" value="">
                <input type="hidden" id="lon" value="">
            </div>

            <button id="btn-solicitar" class="btn-primary" onclick="solicitarViaje()" disabled>Solicitar Mototaxi</button>
        </div>

        <div id="resultado">
            <span id="estado-badge" class="badge">ESTADO</span>
            <h3 id="res-titulo">Procesando...</h3>
            <p id="res-detalle"></p>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicializar mapa
        const map = L.map('map', { zoomControl: false }).setView([-12.0464, -77.0428], 15);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. Capa oficial de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markerPasajero = null;
        let markerMoto = null;

        // 3. Capturar ubicación GPS real de forma estricta y automática
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Asignar a inputs ocultos y visibles
                document.getElementById('lat').value = lat;
                document.getElementById('lon').value = lon;
                document.getElementById('ubicacion-texto').value = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
                document.getElementById('btn-solicitar').disabled = false;

                // Centrar mapa exactamente en la posición del GPS
                map.setView([lat, lon], 17);

                // Colocar marcador fijo del pasajero (sin opción de arrastrar, puro GPS automático)
                markerPasajero = L.marker([lat, lon]).addTo(map)
                    .bindPopup("<b>📍 Tu ubicación GPS exacta</b>")
                    .openPopup();

            }, error => {
                alert("No se pudo obtener tu ubicación GPS. Asegúrate de otorgar permisos de ubicación en tu navegador.");
                document.getElementById('ubicacion-texto').value = "Error al obtener GPS real.";
            }, { 
                enableHighAccuracy: true, // Forzar uso de GPS de alta precisión
                timeout: 10000, 
                maximumAge: 0 // Cero caché, lectura 100% en vivo
            });
        } else {
            alert("Tu dispositivo no soporta geolocalización.");
        }

        async function solicitarViaje() {
            const selectDestino = document.getElementById('destino-select');
            const destino = selectDestino.value;
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;

            if (!destino) {
                alert("Por favor selecciona una zona o distrito de destino.");
                return;
            }

            if (!lat || !lon) {
                alert("Esperando señal GPS precisa. Intenta en un momento.");
                return;
            }

            const resDiv = document.getElementById('resultado');
            const badge = document.getElementById('estado-badge');
            const titulo = document.getElementById('res-titulo');
            const detalle = document.getElementById('res-detalle');

            resDiv.style.display = "block";
            badge.className = "badge";
            badge.innerText = "BUSCANDO";
            titulo.innerText = "Calculando unidad más cercana (Haversine)...";
            detalle.innerText = "Consultando base de datos en TiDB Cloud...";

            const btn = document.getElementById('btn-solicitar');
            btn.innerText = "Procesando...";
            btn.disabled = true;

            try {
                const response = await fetch(`/api/solicitar-viaje?lat=${lat}&lon=${lon}&destino=${encodeURIComponent(destino)}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok && data.exito) {
                    badge.className = "badge success";
                    badge.innerText = "UNIDAD ASIGNADA";
                    titulo.innerText = `¡Mototaxi en camino: ${data.conductor_asignado}!`;
                    detalle.innerHTML = `<strong>Placa:</strong> ${data.placa} <br><strong>Distancia:</strong> ${data.distancia_km} km <br><strong>Destino:</strong> ${data.destino}`;
                    
                    simularMovimientoMoto(parseFloat(lat)+0.002, parseFloat(lon)+0.002, parseFloat(lat), parseFloat(lon));
                } else {
                    badge.className = "badge";
                    badge.innerText = "SIN UNIDADES";
                    titulo.innerText = "No hay unidades disponibles";
                    detalle.innerText = data.mensaje || "Inténtalo de nuevo en unos momentos.";
                }
            } catch (err) {
                badge.className = "badge";
                badge.innerText = "ERROR DE RED";
                titulo.innerText = "Fallo de conexión";
                detalle.innerText = "No se pudo comunicar con el servidor en Render.";
            } finally {
                btn.innerText = "Solicitar Mototaxi";
                btn.disabled = false;
            }
        }

        function simularMovimientoMoto(latIni, lonIni, latFin, lonFin) {
            if (markerMoto) map.removeLayer(markerMoto);

            const motoIcon = L.divIcon({
                html: '🛵',
                className: 'custom-moto-icon',
                iconSize: [32, 32]
            });

            let currentL = latIni;
            let currentLo = lonIni;
            markerMoto = L.marker([currentL, currentLo], { icon: motoIcon }).addTo(map)
                .bindPopup("<b>🛵 Mototaxi acercándose</b>").openPopup();

            let step = 0;
            const totalPasos = 35;

            let intervalo = setInterval(() => {
                step++;
                currentL += (latFin - currentL) / (totalPasos - step + 1);
                currentLo += (lonFin - currentLo) / (totalPasos - step + 1);
                
                if (markerMoto) markerMoto.setLatLng([currentL, currentLo]);

                if (step >= totalPasos) {
                    clearInterval(intervalo);
                    if (markerMoto) markerMoto.bindPopup("<b>✅ ¡Tu mototaxi ha llegado!</b>").openPopup();
                }
            }, 150);
        }
    </script>
</body>
</html>
