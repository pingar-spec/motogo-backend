<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoGo - Selección de Modo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }

        .welcome-card {
            background: #1e293b; width: 100%; max-width: 420px; border-radius: 24px;
            padding: 35px 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 24px;
            border: 1px solid #334155; text-align: center;
        }

        .logo-area h1 { font-size: 34px; font-weight: 900; color: #f97316; margin-bottom: 6px; }
        .logo-area p { font-size: 14px; color: #94a3b8; line-height: 1.4; }

        .role-selection { display: flex; flex-direction: column; gap: 14px; }
        
        .role-btn {
            background: #334155; color: white; border: 2px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; text-decoration: none;
        }
        .role-btn span { font-size: 24px; }

        .driver-mode-btn { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
        .driver-mode-btn:hover { opacity: 0.95; border-color: #60a5fa; transform: translateY(-2px); }

        .passenger-mode-btn { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .passenger-mode-btn:hover { opacity: 0.95; border-color: #fb923c; transform: translateY(-2px); }

        .footer-info { font-size: 11px; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="logo-area">
            <h1>MotoGo 🛵</h1>
            <p>La red inteligente de transporte y movilidad local en el Perú</p>
        </div>

        <div class="role-selection">
            <!-- Botón directo al panel del Conductor -->
            <a href="conductor.html" class="role-btn driver-mode-btn">
                <div style="text-align: left;">
                    <div>Soy Conductor (Socio)</div>
                    <div style="font-size: 11px; font-weight: 400; opacity: 0.9;">Radar GPS y Mapa de Calor</div>
                </div>
                <span>🛵</span>
            </a>

            <!-- Botón directo a la vista del Pasajero -->
            <a href="pasajero.html" class="role-btn passenger-mode-btn">
                <div style="text-align: left;">
                    <div>Soy Pasajero</div>
                    <div style="font-size: 11px; font-weight: 400; opacity: 0.9;">Solicita tu mototaxi en vivo</div>
                </div>
                <span>🧍‍♂️</span>
            </a>
        </div>

        <div class="footer-info">
            Sistema optimizado de alta precisión y tiempo real.
        </div>
    </div>
</body>
</html>
